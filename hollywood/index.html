<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trades Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trades">
<meta name="theme-color" content="#111114">
<style>
:root{
  --bg:#111114; --card:#1b1b20; --line:#2a2a31; --text:#f1f1f3; --muted:#9a9aa6;
  --accent:#f5c451; --accent-ink:#1a1400; --me:#3ecf8e;
  --deadline:#e2383f; --variety:#4b8bf5; --thr:#b98cf5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.updated{color:var(--muted);font-size:13px}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.sites a{display:block;text-align:center;padding:12px 6px;border-radius:12px;font-weight:700;
  text-decoration:none;color:#fff;font-size:15px}
.sites .d{background:var(--deadline)} .sites .v{background:var(--variety)} .sites .t{background:#6c46b8}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:10px;border-radius:9px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.count{font-size:12px;opacity:.8;margin-left:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;
  font-size:13px;padding:6px 11px;border-radius:999px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
input[type=search]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;margin-bottom:12px}
.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
.item.new{border-color:var(--accent)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;flex-wrap:wrap}
.src{font-weight:800;letter-spacing:.02em}
.src.Deadline{color:var(--deadline)} .src.Variety{color:var(--variety)} .src.THR{color:var(--thr)}
.badge-new{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:5px;padding:0 5px}
.title{font-weight:650;font-size:16px;line-height:1.3}
.sum{color:var(--muted);font-size:14px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:999px}
.who{font-size:12px;font-weight:700;color:#0d2a1d;background:var(--me);padding:2px 8px;border-radius:999px}
.dim{opacity:.6}
.empty{color:var(--muted);text-align:center;padding:30px 10px;background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.empty a,.foot a{color:var(--accent)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
.people{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.congrats{display:inline-flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.congrats button{border:1px solid var(--me);background:transparent;color:var(--me);font:inherit;font-size:13px;
  font-weight:700;padding:7px 12px;border-radius:999px}
.congrats button.done{border-color:var(--line);color:var(--muted)}
.item{cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet .box{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--text);font:inherit;font-size:15px}
.sheet textarea{min-height:190px;resize:vertical}
.sheet .row{display:flex;gap:8px;margin-top:12px}
.sheet .row button{flex:1;padding:12px;border-radius:12px;border:0;font:inherit;font-weight:700}
.sheet .go{background:#ea4335;color:#fff} .sheet .alt{background:var(--line);color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trades</h1>
    <span class="updated" id="updated">loading…</span>
  </header>

  <nav class="sites">
    <a class="d" href="https://deadline.com/">Deadline</a>
    <a class="v" href="https://variety.com/">Variety</a>
    <a class="t" href="https://www.hollywoodreporter.com/">THR</a>
  </nav>

  <div class="tabs">
    <button id="tab-people" class="on">My People<span class="count" id="c-people"></span></button>
    <button id="tab-biz">Deals &amp; Hires<span class="count" id="c-biz"></span></button>
  </div>

  <div class="chips" id="chips"></div>
  <input type="search" id="q" placeholder="Search names, companies, shows…" autocomplete="off">
  <div class="people" id="peopleLine"></div>
  <div id="list"></div>

  <p class="foot">
    <a id="editLink" href="#">Edit my list of people</a> · <a href="#" id="markRead">Mark all as seen</a>
  </p>
</div>

<script>
const REPO = "arihshapiro-beep/First-repository-ever";
const BRANCH = "claude/receipt-check-splitter-y8r3pf";
// Your list lives in the private PEOPLE_LIST secret; this opens where you edit it.
document.getElementById('editLink').href = `https://github.com/${REPO}/settings/secrets/actions/PEOPLE_LIST`;

const TAGS = ["Writers & Directors", "Agents & Managers", "Casting", "Deals & Projects"];
const SOURCES = ["Deadline", "Variety", "THR"];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let state = { tab: store.get('tab', 'people'), tag: null, src: null, q: '' };
let data = null;
const lastSeen = store.get('lastSeen', null);

function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s/60)) + 'm ago';
  if (s < 86400) return Math.round(s/3600) + 'h ago';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderChips(){
  const el = document.getElementById('chips');
  const mk = (label, on, fn) => { const b = document.createElement('button'); b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = fn; el.appendChild(b); };
  el.innerHTML = '';
  mk('All', !state.tag && !state.src, () => { state.tag = null; state.src = null; render(); });
  TAGS.forEach(t => mk(t, state.tag === t, () => { state.tag = state.tag === t ? null : t; render(); }));
  SOURCES.forEach(s => mk(s, state.src === s, () => { state.src = state.src === s ? null : s; render(); }));
}

function render(){
  document.getElementById('tab-people').classList.toggle('on', state.tab === 'people');
  document.getElementById('tab-biz').classList.toggle('on', state.tab === 'biz');
  store.set('tab', state.tab);
  renderChips();
  const list = document.getElementById('list');
  const pl = document.getElementById('peopleLine');
  if (!data){ list.innerHTML = '<div class="empty">Loading…</div>'; return; }

  const people = data.items.filter(i => i.people && i.people.length);
  const biz = data.items.filter(i => i.business);
  document.getElementById('c-people').textContent = people.length ? `(${people.length})` : '';
  document.getElementById('c-biz').textContent = biz.length ? `(${biz.length})` : '';

  let rows = state.tab === 'people' ? people : biz;
  if (state.tag) rows = rows.filter(i => i.tags.includes(state.tag));
  if (state.src) rows = rows.filter(i => i.source === state.src);
  if (state.q){
    const q = state.q.toLowerCase();
    rows = rows.filter(i => (i.title + ' ' + i.summary + ' ' + (i.people||[]).join(' ')).toLowerCase().includes(q));
  }

  if (state.tab === 'people'){
    const n = (data.people || []).length;
    pl.textContent = n ? `Watching ${n} ${n === 1 ? 'person' : 'people'}.` : '';
  } else pl.textContent = 'Only deals, hires, signings, castings and agency/management moves — no box office, reviews or gossip.';

  if (!rows.length){
    if (state.tab === 'people' && !(data.people || []).length){
      list.innerHTML = `<div class="empty">You haven't added anyone yet.<br><br><a href="${document.getElementById('editLink').href}">Add names to your PEOPLE_LIST secret →</a></div>`;
    } else if (state.tab === 'people'){
      list.innerHTML = `<div class="empty">No stories about your people ${state.tag || state.src || state.q ? 'match these filters' : 'yet'}.<br>The tracker checks the trades every hour.</div>`;
    } else list.innerHTML = '<div class="empty">Nothing matches these filters.</div>';
    return;
  }

  list.innerHTML = rows.slice(0, 300).map(i => {
    const isNew = lastSeen && i.found > lastSeen;
    const named = state.tab === 'people' ? (i.people||[]).filter(p => namedInHeadline(i, p)) : [];
    const congrats = named.length
      ? `<div class="congrats">${named.map(p => `<button data-congrats="${esc(i.id)}" data-person="${esc(p)}" class="${sentTo(i.id, p) ? 'done' : ''}">${sentTo(i.id, p) ? '✓ Sent' : '✉️ Congrats'} ${esc(p.split(' ')[0])}</button>`).join('')}</div>`
      : '';
    return `<div class="item${isNew ? ' new' : ''}${state.tab === 'people' && !i.business ? ' dim' : ''}" data-link="${esc(i.link)}">
      <div class="meta"><span class="src ${esc(i.source)}">${esc(i.source)}</span><span>${ago(i.published)}</span>${isNew ? '<span class="badge-new">NEW</span>' : ''}</div>
      <div class="title">${esc(i.title)}</div>
      ${i.summary ? `<div class="sum">${esc(i.summary)}</div>` : ''}
      <div class="tags">${(i.people||[]).map(p => `<span class="who">${esc(p)}</span>`).join('')}${i.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${congrats}
    </div>`;
  }).join('');
}


// ---------- Congrats emails (drafted here, sent from your Gmail) ----------
// Emails and your sign-off are saved only on this phone, never on the public site.
const emails = () => store.get('emails', {});
const sentTo = (id, p) => !!store.get('sent', {})[id + '|' + p];
function markSent(id, p){ const s = store.get('sent', {}); s[id + '|' + p] = new Date().toISOString(); store.set('sent', s); }

// Does the headline itself name this person? (full name, or last name for 2+ word names)
function namedInHeadline(item, person){
  const norm = x => x.toLowerCase().replace(/[’']/g, "'");
  const t = norm(item.title), full = norm(person);
  return t.includes(full);
}
function projectTitle(t){
  // a quoted title: opening quote at a word start, closing quote not followed by a letter
  const m = t.match(/(?:^|[\s(])['‘“"]((?:[^'‘’“”"]|[’'](?=[a-z]))+?)[’'”"](?![A-Za-z])/);
  return m ? m[1].replace(/[\s,;:]+$/, '').trim() : '';
}
function draftFor(item, person){
  const first = person.split(' ')[0];
  const t = item.title;
  const pub = item.source === 'THR' ? 'The Hollywood Reporter' : item.source;
  const proj = projectTitle(t);
  const on = proj ? ` ${proj}` : '';
  let subj, why;
  const am = t.match(/\bsign(?:s|ed)?(?: on)? with (.+)$/i);
  const agency = am ? [null, am[1].split(/\s(?:for|in|after|ahead|as|on|following|amid|and|&)\s|[;,:(–—]|\s-\s/i)[0].trim()] : null;
  if (agency){
    subj = `Congrats on signing with ${agency[1]}!`;
    why = `Congrats on signing with ${agency[1]}. That's a huge move, and so well deserved.`;
  } else if (/\b(promot|upped|named|appoint|elevat|partner)/i.test(t)){
    subj = 'Congrats on the promotion!';
    why = `Congrats on the promotion. So well deserved.`;
  } else if (/\b(to direct|to helm|directs|directing|set to direct)\b/i.test(t)){
    subj = proj ? `Congrats on directing ${proj}!` : 'Congrats on the directing gig!';
    why = `Congrats on directing${on || ' the new project'}! I can't wait to see what you do with it.`;
  } else if (/\b(to write|to pen|writes|writing|pens|adapt|showrunner|creator)\b/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the writing gig!';
    why = `Congrats on${on || ' the new writing gig'}! That's such a great fit for you, and I can't wait to see it.`;
  } else if (/\bguest[- ]star/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the guest spot!';
    why = `Congrats on guest starring${proj ? ` on ${proj}` : ''}! That's so fun. Can't wait to watch.`;
  } else if (/\b(to star|stars? in|set for|joins?|boards?|cast|rounds? out|series regular|recurring|lead role|toplines?)\b/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the new role!';
    why = `Congrats on${proj ? ` ${proj}` : ' the new role'}! That's so exciting. Can't wait to watch.`;
  } else if (/\b(exec(utive)?[- ]produc|to produce|producing)\b/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the new project!';
    why = `Congrats on producing${on || ' the new project'}! That's fantastic.`;
  } else if (/\b(renew|orders?|greenlit|green-?light|picks? up|pickup)\b/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the news!';
    why = `Congrats on${proj ? ` ${proj}` : ' the news'} moving forward! That's fantastic.`;
  } else if (/\b(wins?|won|award|prize|honor|nominat)/i.test(t)){
    subj = 'Congrats on the recognition!';
    why = `Congrats on the recognition! So well deserved.`;
  } else if (/\b(deal|pact|inks|lands|nabs|sells|sold|acquires|options?)\b/i.test(t)){
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the deal!';
    why = `Congrats on the deal${proj ? ` for ${proj}` : ''}! That's fantastic news.`;
  } else {
    subj = proj ? `Congrats on ${proj}!` : 'Congrats on the news!';
    why = `Congrats! So great to see this.`;
  }
  const sign = store.get('signoff', '');
  const body = `Hi ${first},\n\nJust saw the news in ${pub}: "${t}". ${why}\n\n${item.link}\n\nWould love to catch up sometime soon and hear more about it.\n\n${sign ? `Best,\n${sign}` : 'Best,'}`;
  return { subj, body };
}

function gmailUrl(to, subj, body){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const android = /Android/.test(navigator.userAgent);
  if (ios) return `googlegmail://co?to=${encodeURIComponent(to)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  if (android) return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  return `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to)}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

function openCongrats(item, person){
  const d = draftFor(item, person);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="box">
    <h3>Congrats ${esc(person)}</h3>
    <label>${esc(person)}'s email (saved on this phone for next time)</label>
    <input id="cg-to" type="email" inputmode="email" autocomplete="off" placeholder="name@example.com" value="${esc(emails()[person] || '')}">
    <label>Subject</label>
    <input id="cg-subj" value="${esc(d.subj)}">
    <label>Message — edit anything</label>
    <textarea id="cg-body">${esc(d.body)}</textarea>
    <label>Sign emails as (saved)</label>
    <input id="cg-sign" placeholder="Your first name" value="${esc(store.get('signoff', ''))}">
    <div class="row"><button class="alt" id="cg-copy">Copy</button><button class="alt" id="cg-cancel">Cancel</button><button class="go" id="cg-go">Open in Gmail</button></div>
  </div>`;
  document.body.appendChild(el);
  const $ = id => el.querySelector('#' + id);
  $('cg-sign').oninput = e => {
    const old = store.get('signoff', ''); const nu = e.target.value.trim();
    const b = $('cg-body');
    b.value = old && b.value.endsWith('\n' + old) ? b.value.slice(0, -old.length) + nu
            : b.value.endsWith('Best,') ? b.value + '\n' + nu : b.value;
    store.set('signoff', nu);
  };
  const save = () => { const e = emails(); const v = $('cg-to').value.trim(); if (v) { e[person] = v; store.set('emails', e); } };
  $('cg-cancel').onclick = () => el.remove();
  el.onclick = e => { if (e.target === el) el.remove(); };
  $('cg-copy').onclick = async () => { try { await navigator.clipboard.writeText($('cg-body').value); $('cg-copy').textContent = 'Copied ✓'; } catch(e) { $('cg-body').select(); } };
  $('cg-go').onclick = () => {
    save(); markSent(item.id, person);
    location.href = gmailUrl($('cg-to').value.trim(), $('cg-subj').value, $('cg-body').value);
    setTimeout(() => { el.remove(); render(); }, 800);
  };
}

document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('[data-congrats]');
  if (b){
    e.stopPropagation();
    const item = data.items.find(i => i.id === b.dataset.congrats);
    if (item) openCongrats(item, b.dataset.person);
    return;
  }
  const card = e.target.closest('.item');
  if (card && card.dataset.link) window.open(card.dataset.link, '_blank', 'noopener');
});

document.getElementById('tab-people').onclick = () => { state.tab = 'people'; render(); };
document.getElementById('tab-biz').onclick = () => { state.tab = 'biz'; render(); };
document.getElementById('q').oninput = e => { state.q = e.target.value.trim(); render(); };
document.getElementById('markRead').onclick = e => { e.preventDefault(); store.set('lastSeen', new Date().toISOString()); location.reload(); };

async function load(){
  try{
    const r = await fetch('data.json?t=' + Date.now(), {cache: 'no-store'});
    data = await r.json();
    document.getElementById('updated').textContent = 'checked ' + ago(data.updated);
    if (!lastSeen) store.set('lastSeen', new Date().toISOString());
  }catch(e){
    data = {items: [], people: []};
    document.getElementById('updated').textContent = 'not run yet';
  }
  render();
}
// remember when you last looked, so the next visit can highlight what's NEW
window.addEventListener('pagehide', () => { if (data && data.updated) store.set('lastSeen', data.updated); });
render(); load();
</script>
</body>
</html>
