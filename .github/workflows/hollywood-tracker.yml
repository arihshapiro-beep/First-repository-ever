name: Hollywood trades tracker

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, at :17 past (GitHub may run it a little late)
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab
  push:
    paths:
      - hollywood/people.txt  # re-scan right away when you edit your list

permissions:
  contents: write
  issues: write

concurrency:
  group: hollywood-tracker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan Deadline, Variety and THR
        env:
          ALERTS_OUT: ${{ runner.temp }}/alerts.json
          PEOPLE_LIST: ${{ secrets.PEOPLE_LIST }}
        run: python scripts/hollywood_scan.py

      - name: Save results
        run: |
          git config user.name  "trades-tracker"
          git config user.email "trades-tracker@users.noreply.github.com"
          git add hollywood/data.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Trades tracker: update $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Notify me about people on my list
        uses: actions/github-script@v7
        env:
          ALERTS_OUT: ${{ runner.temp }}/alerts.json
        with:
          script: |
            const fs = require('fs');
            const p = process.env.ALERTS_OUT;
            if (!fs.existsSync(p)) return;
            const alerts = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!alerts.length) return;
            const names = [...new Set(alerts.flatMap(a => a.people))];
            const title = `🎬 In the trades: ${names.slice(0, 4).join(', ')}${names.length > 4 ? ` +${names.length - 4} more` : ''}`;
            const body = alerts.map(a =>
              `### ${a.people.join(', ')}\n**[${a.title}](${a.link})** — ${a.source}` +
              `${a.tags.length ? ` · _${a.tags.join(', ')}_` : ''}\n\n${a.summary || ''}`
            ).join('\n\n---\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body + `\n\n_Close this when you've read it._`,
              labels: ['trades-alert'],
              assignees: [context.repo.owner],
            }).catch(async e => {
              // label/assignee problems shouldn't block the alert
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            });
