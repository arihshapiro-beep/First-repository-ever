# ONE-TIME: recovers the PEOPLE_LIST secret in encrypted form (public-key encrypted;
# only the holder of the private key can read it). Deleted right after use.
name: Recover people list (one-time)
on:
  push:
    branches: [claude/kind-heisenberg-gz07ue]
    paths: [.github/workflows/recover-people-list.yml, recover/pub.pem]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt list
        env:
          PEOPLE_LIST: ${{ secrets.PEOPLE_LIST }}
        run: |
          set -e
          umask 077
          printf '%s' "$PEOPLE_LIST" > "$RUNNER_TEMP/list.txt"
          openssl rand -hex 32 > "$RUNNER_TEMP/k"
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in "$RUNNER_TEMP/list.txt" -out recover/list.enc -pass file:"$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey recover/pub.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out recover/key.enc
          rm -f "$RUNNER_TEMP/list.txt" "$RUNNER_TEMP/k"
          echo "lines: $(printf '%s' "$PEOPLE_LIST" | grep -c . || true)"
      - name: Save encrypted copy
        run: |
          git config user.name trades-tracker
          git config user.email trades-tracker@users.noreply.github.com
          git add recover/list.enc recover/key.enc
          git commit -m "Encrypted export of people list (temporary)"
          git push
